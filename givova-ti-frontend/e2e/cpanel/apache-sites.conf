ServerName localhost
<Directory /var/www>
    AllowOverride All
    Require all granted
</Directory>
<VirtualHost *:80>
    ServerName suporte-nest.givova.test
    ServerAlias suporte-legacy.givova.test
    DocumentRoot /var/www/nest
</VirtualHost>
<VirtualHost *:443>
    ServerName suporte-nest.givova.test
    DocumentRoot /var/www/nest
    SSLEngine on
    SSLCertificateFile /certs/site.crt
    SSLCertificateKeyFile /certs/site.key
</VirtualHost>
<VirtualHost *:443>
    ServerName suporte-unconfigured.givova.test
    DocumentRoot /var/www/unconfigured
    SSLEngine on
    SSLCertificateFile /certs/site.crt
    SSLCertificateKeyFile /certs/site.key
</VirtualHost>
<VirtualHost *:443>
    ServerName suporte-legacy.givova.test
    DocumentRoot /var/www/legacy
    SSLEngine on
    SSLCertificateFile /certs/site.crt
    SSLCertificateKeyFile /certs/site.key
</VirtualHost>
