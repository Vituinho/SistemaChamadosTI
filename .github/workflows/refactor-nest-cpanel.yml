name: NestJS API + cPanel package (refactor branch)
on:
  push:
    branches:
      - refactor/nestjs-backend-cpanel-20261104
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install NestJS dependencies
        run: npm install --prefix backend-nest --no-audit --no-fund
      - name: Compile and test backend
        run: npm run --prefix backend-nest check
  cpanel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: givova-ti-frontend/package-lock.json
      - name: Install frontend dependencies (upstream lockfile needs refresh)
        run: npm install --prefix givova-ti-frontend --no-audit --no-fund
      - name: Check Next frontend
        run: |
          npm run --prefix givova-ti-frontend lint
          npm run --prefix givova-ti-frontend test
      - name: Build static frontend and cPanel package
        run: python3 scripts/build_cpanel.py
      - name: Check archive integrity
        run: unzip -t dist/cpanel-givova-chamados.zip
      - name: Upload cPanel ZIP
        uses: actions/upload-artifact@v4
        with:
          name: cpanel-givova-chamados
          path: dist/cpanel-givova-chamados.zip
          retention-days: 30
          if-no-files-found: error

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: givova_ti
          POSTGRES_USER: givova
          POSTGRES_PASSWORD: local_integration_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U givova -d givova_ti"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original migrations
        run: python -m pip install -r backend/requirements.lock.txt
      - name: Initialize PostgreSQL with existing Alembic migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://givova:local_integration_only@localhost:5432/givova_ti
        run: python -m alembic upgrade head
      - name: Compile NestJS
        run: |
          npm install --prefix backend-nest --no-audit --no-fund
          npm run --prefix backend-nest build
      - name: Exercise real API against migrated PostgreSQL
        env:
          DATABASE_URL: postgresql://givova:local_integration_only@localhost:5432/givova_ti
          COOKIE_SECURE: 'false'
          ALLOWED_ORIGINS: '["http://localhost:3000"]'
          PORT: '8000'
        run: |
          node backend-nest/dist/src/main.js > /tmp/givova-nest.log 2>&1 &
          server=$!
          trap 'kill $server 2>/dev/null || true; cat /tmp/givova-nest.log' EXIT
          for i in $(seq 1 25); do
            if curl -fsS http://localhost:8000/health; then break; fi
            sleep 1
          done
          node backend-nest/scripts/smoke.cjs
